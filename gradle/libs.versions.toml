[versions]
junit-jupiter = "6.1.3"
rest-assured = "6.0.1"
jackson-databind = "2.22.1"
assertj = "3.27.7"
lombok = "1.18.46"
logback = "1.6.1"
commons-lang3 = "3.20.0"
allure-java = "2.24.0"
allure-plugin = "3.0.0"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "rest-assured" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson-databind" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
allure-jupiter = { module = "io.qameta.allure:allure-jupiter", version.ref = "allure-java" }
allure-rest-assured = { module = "io.qameta.allure:allure-rest-assured", version.ref = "allure-java" }

[plugins]
allure = { id = "io.qameta.allure", version.ref = "allure-plugin" }